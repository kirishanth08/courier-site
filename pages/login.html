<!doctype html>
<html lang="en"><head>
    <link rel="icon" type="image/svg+xml" href="../assets/css/favicon.svg">
    <link rel="shortcut icon" href="../assets/css/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/css/favicon.svg">

<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Login | SwiftShip</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/custom.css" rel="stylesheet">
</head><body class="swift-auth-body">
<div class="swift-login-page">
<div class="swift-auth-tools">
<button id="theme-toggle" type="button" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
<button id="rtl-toggle" type="button" title="Toggle RTL">RTL</button>
</div>
<div class="swift-login-shell">
<a href="../index.html" class="swift-company" aria-label="SwiftShip Express Home"><div class="swift-company-logo">S</div><div>SwiftShip</div></a>
<h1 class="swift-login-title">Welcome back</h1>
<p class="swift-login-subtitle">Sign in to access your dashboard</p>
<form class="swift-login-form" id="loginForm">
<label class="form-label" for="email">Email Address</label>
<div class="swift-input-wrap"><i class="fa-regular fa-envelope swift-input-icon"></i><input id="email" type="email" class="form-control" placeholder="you@example.com" required></div>
<label class="form-label" for="password">Password</label>
<div class="swift-input-wrap"><i class="fa-solid fa-lock swift-input-icon"></i><input id="password" type="password" class="form-control" placeholder="Enter your password" required><button class="swift-password-toggle" type="button" id="togglePassword"><i class="fa-solid fa-eye"></i></button></div>
<div class="swift-login-options"><label class="form-check mb-0"><input class="form-check-input" type="checkbox"><span>Remember me</span></label><a href="#">Forgot password?</a></div>
<button class="swift-signin-btn" type="submit"><i class="fa-solid fa-right-to-bracket me-2"></i>Sign In</button>
</form>
<div class="swift-divider">or continue with</div>
<div class="swift-socials"><button class="swift-social" type="button"><span class="swift-google me-2">G</span> Google</button><button class="swift-social" type="button"><i class="fa-brands fa-apple swift-apple me-2"></i> Apple</button></div>
<div class="swift-create">Don't have an account? <a href="register.html">Create one</a></div>
<a class="swift-admin-link" href="admin-login.html"><i class="fa-solid fa-user-shield"></i>Sign in as admin instead</a>
</div></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('togglePassword')?.addEventListener('click',function(){const i=document.getElementById('password'),x=this.querySelector('i'),s=i.type==='text';i.type=s?'password':'text';x.className=s?'fa-solid fa-eye':'fa-solid fa-eye-slash';});
document.getElementById('loginForm')?.addEventListener('submit',function(e){e.preventDefault();sessionStorage.setItem('swiftshipRole','customer'); sessionStorage.setItem('swiftshipLoggedIn','true'); location.href='customer-dashboard.html';});
</script>
</body></html>
