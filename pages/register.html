<!doctype html>
<html lang="en">
<head>
    <link rel="icon" type="image/svg+xml" href="../assets/css/favicon.svg">
    <link rel="shortcut icon" href="../assets/css/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/css/favicon.svg">

<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Create your account | SwiftShip</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
<link href="../assets/css/custom.css" rel="stylesheet">
</head>
<body class="swift-auth-body">
<div class="swift-auth-page">
<div class="swift-auth-tools">
<button type="button" id="theme-toggle" title="Toggle dark mode"><i class="fa-solid fa-moon"></i></button>
<button type="button" id="rtl-toggle" title="Toggle RTL">RTL</button>
</div>
<div class="swift-auth-shell"><a href="../index.html" class="swift-company" aria-label="SwiftShip Express Home"><div class="swift-company-logo">S</div><div>SwiftShip</div></a>
<h1 class="swift-auth-title">Create your account</h1>
<p class="swift-auth-subtitle">Sign up to book and track your shipments</p>
<form class="swift-auth-form" id="authForm">

<label class="form-label" for="firstName">Full Name</label>
<input id="firstName" class="form-control mb-4" type="text" placeholder="Enter your full name" required>
<label class="form-label" for="email">Email Address</label>
<input id="email" class="form-control mb-4" type="email" placeholder="you@example.com" required>
<label class="form-label" for="password">Password</label>
<input id="password" class="form-control mb-4" type="password" placeholder="Create a password" required>
<label class="form-label" for="confirmPassword">Confirm Password</label>
<input id="confirmPassword" class="form-control mb-4" type="password" placeholder="Confirm your password" required>
<div class="form-check mb-4"><input class="form-check-input" type="checkbox" required><label class="form-check-label">I agree to the Terms & Conditions</label></div>

<button class="swift-auth-btn" type="submit"><i class="fa-solid fa-user-plus me-2"></i>Create Account</button>
</form>
<div class="swift-auth-note">Already have an account? <a href="login.html">Sign in</a></div>

</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/bootstrap.bundle.min.js"></script>
<script src="../assets/js/main.js"></script>
<script>
document.getElementById('togglePassword')?.addEventListener('click',function(){
 const input=document.getElementById('password');
 const icon=this.querySelector('i');
 const show=input.type==='text';
 input.type=show?'password':'text';
 icon.className=show?'fa-solid fa-eye':'fa-solid fa-eye-slash';
});
document.getElementById('authForm')?.addEventListener('submit',function(e){
 e.preventDefault();
 sessionStorage.setItem('swiftshipRole','customer'); sessionStorage.setItem('swiftshipLoggedIn','true'); location.href='customer-dashboard.html';
});
</script>
</body>
</html>
