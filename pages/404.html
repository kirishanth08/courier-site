<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
<head>
    <link rel="icon" type="image/svg+xml" href="../assets/css/favicon.svg">
    <link rel="shortcut icon" href="../assets/css/favicon.svg">
    <link rel="apple-touch-icon" href="../assets/css/favicon.svg">

<meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Page not found - The page you're looking for on SwiftShip Express doesn't exist or has been moved.">
    <meta name="robots" content="noindex, nofollow">
    <meta property="og:title" content="404 - Page Not Found | SwiftShip Express">
    <meta property="og:description" content="The page you're looking for doesn't exist or has been moved to a new address.">
    <meta property="og:type" content="website">
    <title>404 - Page Not Found | SwiftShip Express</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
    tailwind.config = { darkMode:'class', theme:{ extend:{ colors:{ brand:{ 50:'#fff7ed',100:'#ffedd5',200:'#fed7aa',300:'#fdba74',400:'#fb923c',500:'#f97316',600:'#ea580c',700:'#c2410c',800:'#9a3412',900:'#7c2d12' } } } } }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="../assets/css/custom.css">
    <style>
        @keyframes truck-bounce {
            0%, 100% { transform: translateY(0) rotate(0deg); }
            25% { transform: translateY(-8px) rotate(-1deg); }
            50% { transform: translateY(0) rotate(0deg); }
            75% { transform: translateY(-4px) rotate(1deg); }
        }
        @keyframes question-float {
            0%, 100% { transform: translateY(0); opacity: 1; }
            50% { transform: translateY(-12px); opacity: 0.6; }
        }
        .truck-bounce { animation: truck-bounce 3s ease-in-out infinite; }
        .question-float { animation: question-float 2s ease-in-out infinite; }
    </style>
</head>
<body class="bg-white dark:bg-gray-900 text-gray-800 dark:text-gray-200">

    <!-- Preloader -->
    <div class="preloader fixed inset-0 z-[9999] bg-white dark:bg-gray-900 flex items-center justify-center transition-opacity duration-500" id="preloader">
        <div class="text-center">
            <div class="relative w-20 h-20 mx-auto mb-4">
                <div class="absolute inset-0 border-4 border-brand-200 dark:border-brand-800 rounded-full"></div>
                <div class="absolute inset-0 border-4 border-transparent border-t-brand-500 rounded-full animate-spin"></div>
                <i class="fas fa-shuttle-van absolute inset-0 flex items-center justify-center text-brand-500 text-xl"></i>
            </div>
            <p class="text-sm font-semibold text-gray-500 tracking-wider uppercase">SwiftShip Express</p>
        </div>
    </div>

    <!-- Navbar (Simplified) -->
    <header class="fixed top-0 left-0 right-0 z-[100] bg-white/80 dark:bg-gray-900/80 backdrop-blur-md transition-all duration-300">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16 lg:h-20">
                <a href="../index.html" class="flex items-center gap-2 shrink-0" aria-label="SwiftShip Express Home">
                    <div class="w-10 h-10 bg-brand-500 rounded-xl flex items-center justify-center shadow-lg shadow-brand-500/30"><i class="fas fa-shuttle-van text-white"></i></div>
                    <span class="text-xl font-extrabold"><span class="text-brand-500">Swift</span><span class="dark:text-white">Ship</span></span>
                </a>
                <button id="themeToggle" class="p-2.5 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-800 transition-colors" aria-label="Toggle dark mode">
                    <i class="fas fa-moon dark:hidden text-gray-600"></i><i class="fas fa-sun hidden dark:inline text-yellow-400"></i>
                </button>
            </div>
        </div>
    </header>

    <!-- 404 Content -->
    <section class="min-h-screen flex items-center justify-center pt-20 px-6" aria-label="404 Error">
        <div class="max-w-2xl mx-auto text-center">
            <!-- Animated Truck Illustration -->
            <div class="relative mb-8">
                <div class="truck-bounce inline-block">
                    <div class="relative inline-block">
                        <i class="fas fa-truck text-6xl sm:text-7xl text-brand-500/20 dark:text-brand-500/10"></i>
                        <div class="absolute -top-2 -right-2 question-float">
                            <div class="w-12 h-12 bg-brand-500 rounded-full flex items-center justify-center shadow-lg shadow-brand-500/30">
                                <span class="text-white text-xl font-extrabold">?</span>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 404 Number -->
            <h1 class="text-8xl sm:text-9xl font-extrabold text-brand-500 leading-none">404</h1>

            <!-- Heading -->
            <h2 class="text-2xl sm:text-3xl font-extrabold mt-4 mb-4 dark:text-white">Oops! This Parcel Got Lost</h2>

            <!-- Description -->
            <p class="text-gray-500 dark:text-gray-400 text-lg max-w-md mx-auto mb-10 leading-relaxed">The page you're looking for doesn't exist or has been moved to a new address.</p>

            <!-- Search Input -->
            <div class="max-w-md mx-auto mb-8">
                <div class="relative">
                    <span class="absolute left-4 top-1/2 -translate-y-1/2 text-gray-400"><i class="fas fa-search"></i></span>
                    <input type="text" id="searchInput" class="w-full pl-12 pr-4 py-4 border border-gray-200 dark:border-gray-700 rounded-xl bg-gray-50 dark:bg-gray-800 text-gray-800 dark:text-gray-200 focus:outline-none focus:ring-2 focus:ring-brand-500 focus:border-brand-500 transition-all" placeholder="Search or enter tracking number..." aria-label="Search or track">
                    <button id="searchBtn" class="absolute right-2 top-1/2 -translate-y-1/2 px-5 py-2 bg-brand-500 text-white text-sm font-semibold rounded-lg hover:bg-brand-600 transition-colors" aria-label="Search">
                        Search
                    </button>
                </div>
            </div>

            <!-- Action Buttons -->
            <div class="flex flex-wrap gap-4 justify-center">
                <a href="../index.html" class="btn-primary">
                    <i class="fas fa-home"></i> Go Home
                </a>
                <a href="customer-dashboard.html" class="btn-secondary">
                    <i class="fas fa-shipping-fast"></i> Track Shipment
                </a>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-gray-900 text-gray-400 pt-12 pb-0 fixed bottom-0 left-0 right-0">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="border-t border-gray-800 pt-6 pb-6 flex flex-col sm:flex-row items-center justify-between gap-4 text-sm">
                <p>&copy; 2026 SwiftShip Express. All rights reserved.</p>
                <div class="flex gap-6">
                    <a href="#" class="hover:text-brand-500">Privacy Policy</a>
                    <a href="#" class="hover:text-brand-500">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <script src="../assets/js/main.js"></script>
    <script>
    document.addEventListener('DOMContentLoaded', function() {
        var searchBtn = document.getElementById('searchBtn');
        var searchInput = document.getElementById('searchInput');
        if (searchBtn && searchInput) {
            function doSearch() {
                var val = searchInput.value.trim();
                if (!val) return;
                if (/^[A-Za-z0-9]{8,15}$/.test(val)) {
                    window.location.href = 'customer-dashboard.html?tracking=' + encodeURIComponent(val);
                } else {
                    window.location.href = '../index.html?q=' + encodeURIComponent(val);
                }
            }
            searchBtn.addEventListener('click', doSearch);
            searchInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') doSearch();
            });
        }
    });
    </script>
</body>
</html>
